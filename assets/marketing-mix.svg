<title id="t">Marketing Mix 9P</title>
<desc id="d">The nine Ps in three layers that add up. The classic 4P: Product, Price, Place, Promotion. Three more for services make 7P: People, Process, Physical evidence. Two bonus Ps make 9P: Purple Cow and Partnership.</desc>
